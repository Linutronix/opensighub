[project]
name = "opensighub"
version = "0.3.0"
license = "GPL-3.0-or-later AND 0BSD"
license-files = ["LICENSES/*.txt"]
description = "OpenSigHub signs boot and operating system artifacts like UEFI Secure Boot, NXP HAB4 or swupdate files"
readme = "README.md"
authors = [
    {name = "Linutronix GmbH", email = "info@linutronix.de"},
]
dependencies = [
    "PyYAML~=6.0",
    "platformdirs~=4.0",
]
requires-python = ">= 3.11"
keywords = ["code-signing", "pkcs11", "hsm", "secure-boot", "uefi", "debian", "embedded", "swupdate"]
classifiers = [
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Boot",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Linutronix/opensighub"
Repository = "https://github.com/Linutronix/opensighub"
Issues = "https://github.com/Linutronix/opensighub/issues"
Documentation = "https://github.com/Linutronix/opensighub/blob/main/docs/user-manual.md"

[project.scripts]
opensighub = "opensighub.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring native signing tools and/or a SoftHSM token",
    "live: tests against external services for compatibility, not suited for isolated environments",
    "unit: tests not marked integration or live; applied automatically, do not set explicitly",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "bandit~=1.7",
    "invoke~=2.2",
    "mypy~=1.0",
    "pytest~=7.2",
    "ruff~=0.6",
    "pytest-cov~=6.0.0",
    "reuse>=6.2.0",
    "types-PyYAML",
    "vhs~=1.1",
]
